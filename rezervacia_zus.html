<!DOCTYPE html>
<html lang="sk">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Rezervácia</title>

<style>

body{
  font-family:Arial;
  max-width:800px;
  margin:auto;
  padding:20px;
}

table{
  border-collapse:collapse;
  width:100%;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}

input{
  width:95%;
  height:34px;
}

button{
  margin-top:4px;
  padding:6px 10px;
}

.free{
  background:#eaffea;
}

.taken{
  background:#ffdede;
}

</style>
</head>
<body>

<h2>Rezervácia rozohrávok</h2>

<table id="grid"></table>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyRz0UFyO_f3fHAoMkGqMqDVt43SuWSy-aOfmhm0vmUO56lJyBOEfRAOMFfSeQZmVcl/exec";



async function loadSlots(){

 const res = await fetch(API_URL + "?t=" + Date.now(), {
  method: "GET",
  mode: "cors"
});

  const data =
    await res.json();

  buildGrid(data);
}



function buildGrid(data){

  const table =
    document.getElementById("grid");

  table.innerHTML = `
    <tr>
      <th>Čas</th>
      <th>Meno</th>
      <th>Email</th>
    </tr>
  `;


  data.forEach(slot => {

    const tr =
      document.createElement("tr");


    tr.innerHTML += `
      <td>${slot.time}</td>
    `;


    // obsadené
    if(slot.name){

      tr.innerHTML += `
        <td class="taken">
          Obsadené
        </td>

        <td class="taken">
          ---
        </td>
      `;

    }

    // voľné
    else{

      tr.innerHTML += `

        <td class="free">
          <input
            id="name_${slot.time}"
            placeholder="Meno">
        </td>

        <td class="free">

          <input
            id="email_${slot.time}"
            placeholder="Email">

          <button onclick="
            reserve('${slot.time}')
          ">
            Rezervovať
          </button>

        </td>
      `;
    }

    table.appendChild(tr);
  });
}



// rezervácia
async function reserve(time){

  const name =
    document.getElementById(
      "name_" + time
    ).value;


  const email =
    document.getElementById(
      "email_" + time
    ).value;


  if(!name || !email){

    alert("Vyplň údaje");
    return;
  }


  cconst res = await fetch(API_URL, {
  method: "POST",
  mode: "cors",
  headers: {
    "Content-Type": "text/plain"
  },
  body: JSON.stringify({
    time,
    name,
    email
  })
});


  const result =
    await res.json();

  alert(result.message);

  loadSlots();
}


loadSlots();

</script>
</body>
</html>
