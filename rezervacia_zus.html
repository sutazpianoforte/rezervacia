<!DOCTYPE html>
<html lang="sk">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Rezervácia</title>

<style>

body{
  font-family:Arial;
  max-width:800px;
  margin:auto;
  padding:20px;
}

table{
  border-collapse:collapse;
  width:100%;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}

input{
  width:95%;
  height:34px;
}

button{
  margin-top:4px;
  padding:6px 10px;
}

.free{
  background:#eaffea;
}

.taken{
  background:#ffdede;
}

</style>
</head>
<body>

<h2>Rezervácia rozohrávok</h2>

<table id="grid"></table>

<script>

const API_URL =
"const API_URL =
"https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQhmJMWEG1AzX_JmbljTiqLq8ltiLcXopZ1w9hmr-JGCv8QQPmI-efgmfEoC5tn22hZbcaUS62iRUlSr4x0bYy7SXJwbPOA25F732UkqZ3ZhKTLws7m9QdXsYZEq-fAtj5C4ze-paF1tgHt8MvXs-Sjt36CRQ9BpdrgdbLBHbq_sZ2XnxSepAlRNK_tLRtuDuIpOL9MeS8lvNlBMkPz__KWdFFW7gge2fIqrN2yE1Col9AT0M9-FwbdvGz2E98Y_ecHJIYP1_P2v7EBOtmj3zcrWz8ndQ&lib=MxIZx2YsJIzJwrefRPKfPIUWzQRt5QScL";


// načítanie údajov
async function loadSlots() {
  const res = await fetch(API_URL + "?t=" + Date.now(), {
    method: "GET",
    mode: "cors"
  });

  const data = await res.json();

  buildGrid(data);
}


// vykreslenie tabuľky
function buildGrid(data){

  const table = document.getElementById("grid");

  table.innerHTML = `
    <tr>
      <th>Čas</th>
      <th>Meno</th>
      <th>Email</th>
    </tr>
  `;

  data.forEach(slot => {

    const tr = document.createElement("tr");

    tr.innerHTML += `
      <td>${slot.time}</td>
    `;

    // obsadené
    if(slot.name){

      tr.innerHTML += `
        <td class="taken">Obsadené</td>
        <td class="taken">---</td>
      `;
    }

    // voľné
    else{

      tr.innerHTML += `
        <td class="free">
          <input id="name_${slot.time}" placeholder="Meno">
        </td>

        <td class="free">
          <input id="email_${slot.time}" placeholder="Email">

          <button onclick="reserveSlot('${slot.time}')">
            Rezervovať
          </button>
        </td>
      `;
    }

    table.appendChild(tr);
  });
}


// rezervácia
async function reserveSlot(time) {

  const name =
    document.getElementById(`name_${time}`).value;

  const email =
    document.getElementById(`email_${time}`).value;

  if(!name || !email){
    alert("Vyplňte meno aj email");
    return;
  }

  const res = await fetch(API_URL, {
    method: "POST",
    mode: "cors",
    headers: {
      "Content-Type": "text/plain"
    },
    body: JSON.stringify({
      time: time,
      name: name,
      email: email
    })
  });

  const result = await res.json();

  alert(result.message);

  loadSlots();
}


loadSlots();

</script>
</body>
</html>
