<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Rezervácia rozohrávok ZUŠ</title>
<style>
  body { font-family: Arial; max-width: 400px; margin: auto; padding: 20px; }
  input { width: 95%; height: 25px; font-size: 14px; padding: 5px; margin: 4px 0; box-sizing: border-box; }
  button { margin-top: 5px; }
  .slot { padding: 3px; margin: 3px 0; font-size: 13px; border: 1px solid #ccc; }
  .slot.volne { background: #d4eaed; cursor: pointer; }
  .slot.obsadene { background: #f8d7da; cursor: not-allowed; }
  .loading { text-align: center; color: #666; font-style: italic; }
</style>
</head>
<body>

<h2>Rezervácia rozohrávok ZUŠ</h2>

<div id="slots" class="loading">Načítavam voľné termíny...</div>

<script>
// 🔥 Vymeň túto URL za svoju URL adresu z Google Apps Scriptu (v úvodzovkách)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOlsWsNEuSltNsZioTGBbS7ZVFaXhWeRCEsvmqASmpY-FJsiuh8vZXkaAAIoBLzOZt/exec";

function loadSlots() {
  const container = document.getElementById("slots");
  container.innerHTML = "<div class='loading'>Aktualizujem dáta...</div>";

  // Pridaný parameter { redirect: "follow" }
  fetch(SCRIPT_URL, { redirect: "follow" })
    .then(response => response.json())
    .then(data => renderSlots(data))
    .catch(err => {
      container.innerHTML = "Chyba pri načítaní dát.";
      console.error(err);
    });
}
  
function renderSlots(data) {
  const container = document.getElementById("slots");
  container.innerHTML = "";

  data.forEach(slot => {
    const div = document.createElement("div");
    div.className = "slot " + (slot.status === "obsadené" ? "obsadene" : "volne");

    if (slot.status === "obsadené") {
      div.textContent = slot.time + " - obsadené";
    } 
    else {
      div.textContent = slot.time;

      div.onclick = () => {
        if (div.querySelector('input')) return; // prevencia duplicity
        div.innerHTML = "";

        const title = document.createElement("div");
        title.textContent = slot.time;

        const inputName = document.createElement("input");
        inputName.placeholder = "Meno";

        const inputEmail = document.createElement("input");
        inputEmail.placeholder = "Email";

        inputName.onclick = (e) => e.stopPropagation();
        inputEmail.onclick = (e) => e.stopPropagation();

        const btn = document.createElement("button");
        btn.textContent = "Uložiť";

        btn.onclick = (e) => {
          e.stopPropagation();

          const name = inputName.value.trim();
          const email = inputEmail.value.trim();

          if (!name || !email) {
            alert("Vyplň meno aj email");
            return;
          }

          btn.disabled = true;
          btn.textContent = "Odosielam...";

          // Posielanie dát na Google Apps Script upravené pre obídenie CORS
          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: {
              "Content-Type": "text/plain"
            },
            body: JSON.stringify({ time: slot.time, name: name, email: email })
          })
          .then(() => {
            loadSlots();
          })
          .catch(err => {
            alert("Chyba spojenia so serverom.");
            btn.disabled = false;
            btn.textContent = "Uložiť";
          });
        }; // <-- Tu končí btn.onclick

        // Prvky sa musia pridať do políčka (div) až PO definovaní tlačidla
        div.appendChild(title);
        div.appendChild(inputName);
        div.appendChild(inputEmail);
        div.appendChild(btn);
      }; // <-- Tu končí div.onclick
    }
    container.appendChild(div);
  });
}

// Načítanie pri štarte
loadSlots();
</script>

</body>
</html>
